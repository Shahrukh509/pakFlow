version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pakflow-ai-app
    container_name: pakflow_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      CONTAINER_ROLE: app
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis

  queue:
    image: pakflow-ai-app
    container_name: pakflow_queue
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work redis --tries=3
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: pakflow_mysql
    restart: always
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: pakflow_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  dbdata: